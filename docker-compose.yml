version: '3.8'

services:
  # Main MCP Server service as per ARS specifications
  mcp-server:
    build:
      context: ./code
      dockerfile: Dockerfile.mcp-server
    restart: unless-stopped
    ports:
      - "8700:8700"
    environment:
      - ENV=production
    volumes:
      - ./data/mcp-server:/app/data
    depends_on:
      - redis
      - postgres
    networks:
      - ars-network

  # Database service (PostgreSQL)
  postgres:
    image: postgres:13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ars_db
      POSTGRES_USER: ars_user
      POSTGRES_PASSWORD: ars_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ars-network

  # Redis cache service
  redis:
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ars-network

volumes:
  postgres_data:
  redis_data:

networks:
  ars-network:
    driver: bridge