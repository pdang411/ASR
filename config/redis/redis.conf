# Redis configuration for ARS system

# Network settings
bind 0.0.0.0
port 6379

# Persistence
save 900 1
save 300 10
save 60 10000

# Memory limits
maxmemory 2gb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Other settings
tcp-keepalive 300
timeout 0
databases 16